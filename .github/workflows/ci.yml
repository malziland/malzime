name: CI

# GITHUB_TOKEN minimal halten. Der Repo-Default steht bereits auf "read" —
# hier festgeschrieben, damit ein künftiges Umstellen des Defaults die CI
# nicht still mit Schreibrechten ausstattet.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # v3.0.0 laeuft nativ auf Node.js 24 — der frueher noetige
          # FORCE_JAVASCRIPT_ACTIONS_TO_NODE24-Workaround entfaellt damit.

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run lint:frontend
      - run: npm run format:frontend:check
      - run: npm run test:frontend

  test-e2e:
    runs-on: ubuntu-latest
    # Offizielles Playwright-Image mit VORINSTALLIERTEM Chromium (Browser-Version
    # exakt passend zu @playwright/test 1.61.1). Damit entfaellt der
    # fehleranfaellige Browser-Download von cdn.playwright.dev komplett — der
    # blieb in der CI zuverlaessig nach dem 100%-Download beim Entpacken/
    # Finalisieren haengen und blockierte als Pflicht-Check JEDEN PR.
    # WICHTIG: Bei einem Minor-Update von @playwright/test (z.B. 1.59 -> 1.60)
    # muss dieser Image-Tag mitgezogen werden, sonst passt der Browser nicht mehr.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run test:e2e

  lighthouse:
    # Misst die LIVE-Domain, nicht den PR-Stand — als Post-Deploy-Monitor nur
    # auf push sinnvoll; auf PRs wäre ein grünes Ergebnis irreführend.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: |
            https://malzi.me
            https://malzi.me/datenschutz
            https://malzi.me/impressum
          budgetPath: .github/lighthouse-budget.json
          uploadArtifacts: true

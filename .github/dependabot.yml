version: 2

# Gebuendelte Updates: Dependabot fasst alle harmlosen Updates (patch + minor)
# je Bereich zu EINEM Pull Request zusammen, statt fuer jedes Paket einen
# eigenen aufzumachen. Am 2026-07-01 waren es acht einzelne PRs — mit
# Buendelung waeren es drei gewesen. Zusammen mit dem funktionierenden
# Auto-Merge (.github/workflows/dependabot-automerge.yml) laufen die drei
# ohne Zutun durch.
#
# Major-Updates bleiben BEWUSST ungebuendelt und einzeln: die brauchen ohnehin
# eine manuelle Freigabe, und in einem Sammel-PR wuerde man sie uebersehen.

updates:
  # Root-Projekt (Frontend devDependencies)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    groups:
      frontend-tooling:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      frontend-sicherheit:
        applies-to: security-updates
        patterns:
          - "*"

  # Cloud Functions (Backend)
  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    groups:
      # Getrennt nach produktiv/Werkzeug, damit der Auto-Merge-Workflow beides
      # unterschiedlich behandeln kann: Werkzeuge laufen durch, Produktivpakete
      # brauchen eine Handprüfung (siehe dependabot-automerge.yml).
      backend-werkzeuge:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      backend-produktiv:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      backend-sicherheit:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "ci"
    groups:
      ci-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

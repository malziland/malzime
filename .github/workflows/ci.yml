name: CI

# GITHUB_TOKEN minimal halten. Der Repo-Default steht bereits auf "read" —
# hier festgeschrieben, damit ein künftiges Umstellen des Defaults die CI
# nicht still mit Schreibrechten ausstattet.
permissions:
  contents: read

# ── Nur der neueste Lauf je Zweig zaehlt ──
#
# BEFUND 31.08.2026: In der Nacht wurde zehnmal in einer halben Stunde auf
# denselben Zweig gepusht. Jeder Push startete einen vollstaendigen Prueflauf,
# und keiner brach den vorigen ab — bis zu fuenf E2E-Laeufe liefen gleichzeitig,
# jeder rund neun Minuten mit vier Browsern.
#
# Drei Folgen, alle unerwuenscht:
#   · Fehlschlagsmeldungen fuer Staende, die laengst ueberholt sind
#   · Zeitprobleme in den Browser-Tests durch Konkurrenz um dieselbe Maschine
#     (genau die Klasse Fehler, die keyboard.test.js flackern liess)
#   · Rechenzeit fuer Ergebnisse, die niemand mehr braucht
#
# Ein Ergebnis zu einem ueberholten Stand ist wertlos. Also wird er abgebrochen.
#
# AUSNAHME `main`: Dort wird NICHT abgebrochen. Die Stand-Bindung im Deploy
# verlangt gruene Pflicht-Checks fuer genau diesen Commit — ein abgebrochener
# Lauf wuerde eine spaetere Auslieferung dieses Standes blockieren.
concurrency:
  # BEFUND 31.08.2026 (unvorbelastetes Review): `cancel-in-progress: false`
  # verhindert nur, dass ein LAUFENDER Lauf abgebrochen wird. GitHub haelt je
  # Gruppe aber hoechstens EINEN wartenden — ein dritter Push storniert den
  # zweiten. Drei schnelle Commits auf main (Release, Cache-Kennung,
  # Nachzuegler — in dieser Nacht genau so passiert) haetten den mittleren
  # als `cancelled` enden lassen. Der Deploy dieses Standes waere blockiert
  # gewesen: genau das, was die Ausnahme verhindern sollte.
  #
  # Deshalb bekommt auf main JEDER Commit seine eigene Gruppe. Dann gibt es
  # dort keine Konkurrenz und nichts zu verdraengen. Auf Zweigen bleibt es bei
  # einer Gruppe je Zweig — dort ist das Verdraengen ja der Sinn.
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      github.ref == 'refs/heads/main' && format('-{0}', github.sha) || ''
    }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # AUDIT-BEFUND OPS-2026-08-12-11: Die harte Frist-Bremse (zusagen-frische.test.js)
  # haengt in `test-backend` — lief aber nur bei Push und Pull-Request. Ohne Commit
  # kein Lauf, ohne Lauf keine Bremse. Damit waren BEIDE Schichten (Wochen-
  # Erinnerung und CI-Waechter) ereignisgesteuert und konnten gemeinsam
  # verstummen. Der Zeitplan gibt der Bremse eine eigene Uhr.
  schedule:
    - cron: "17 6 * * 1" # montags 06:17 UTC, vor der Wochen-Erinnerung um 07:00 UTC

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # BEFUND 01.09.2026 (Runde 7, L-15): Fuer Node steht die Begruendung
      # oben — fuer Python galt sie genauso, nur stand sie nirgends. Sechs
      # Waechter laufen mit python3; bisher mit dem, was das Runner-Image
      # gerade mitbrachte. Faellt das weg oder springt es auf eine Fassung,
      # die eine Datei anders liest, meldet die Pipeline keinen fehlenden
      # Waechter, sondern einen Fehler an falscher Stelle.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci

      # Audit-Gate mit begruendeter, ABLAUFENDER Ausnahmeliste statt nacktem
      # `npm audit --audit-level=high`. Grund: das nackte audit blockiert bei
      # einer unreparierbaren Fremd-Luecke JEDEN PR — am 2026-07-01 sind daran
      # alle acht Dependabot-PRs gescheitert. Details: scripts/audit-gate.mjs
      # AUDIT-BEFUND OSS-2026-08-12-23: Das Gate prueft jetzt BEIDE Baeume. Der
      # Wurzel-Baum (Playwright, Vitest, ESLint) lief bisher durch keinen Riegel,
      # obwohl genau dieser Code in der CI ueber dem ausgecheckten Repository
      # laeuft. Aktuell sind beide Baeume auf 0 — der Riegel fehlte trotzdem.
      - run: node ../scripts/audit-gate.mjs functions .

      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      # TEST-2026-08-20-01: Ein Test verglich die ECHTE Uhr mit einem festen Datum im
      # Produktivcode. Er war gruen — bis zu einem berechenbaren Tag, ab dem er bei
      # jedem Lauf rot geworden waere und als Pflicht-Check jede Auslieferung blockiert
      # haette, ohne dass jemand etwas geaendert hat. Die Pruefung misst die WIRKUNG:
      # Sie sucht Tests zu Code mit festem Zeitpunkt und laesst genau die mit
      # vorgestellter Uhr laufen. Sie haengt an den Test-Jobs, weil sie den jeweiligen
      # Runner braucht — der schlanke Job `pruefungen` hat bewusst keine Pakete.
      # Exit 2 (Messproblem) gilt nie als bestanden.
      - run: sh scripts/pruefe-zeitzuender.sh . --nur backend
        working-directory: .

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # v3.0.0 laeuft nativ auf Node.js 24 — der frueher noetige
          # FORCE_JAVASCRIPT_ACTIONS_TO_NODE24-Workaround entfaellt damit.

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # BEFUND 01.09.2026 (Runde 7, L-15): Fuer Node steht die Begruendung
      # oben — fuer Python galt sie genauso, nur stand sie nirgends. Sechs
      # Waechter laufen mit python3; bisher mit dem, was das Runner-Image
      # gerade mitbrachte. Faellt das weg oder springt es auf eine Fassung,
      # die eine Datei anders liest, meldet die Pipeline keinen fehlenden
      # Waechter, sondern einen Fehler an falscher Stelle.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run lint:frontend
      - run: npm run format:frontend:check
      - run: npm run test:frontend

      # TEST-2026-08-20-01: Ein Test verglich die ECHTE Uhr mit einem festen Datum im
      # Produktivcode. Er war gruen — bis zu einem berechenbaren Tag, ab dem er bei
      # jedem Lauf rot geworden waere und als Pflicht-Check jede Auslieferung blockiert
      # haette, ohne dass jemand etwas geaendert hat. Die Pruefung misst die WIRKUNG:
      # Sie sucht Tests zu Code mit festem Zeitpunkt und laesst genau die mit
      # vorgestellter Uhr laufen. Sie haengt an den Test-Jobs, weil sie den jeweiligen
      # Runner braucht — der schlanke Job `pruefungen` hat bewusst keine Pakete.
      # Exit 2 (Messproblem) gilt nie als bestanden.
      - run: sh scripts/pruefe-zeitzuender.sh . --nur frontend

  # Liest die Playwright-Version aus dem Lockfile und reicht sie an test-e2e
  # weiter. Frueher stand die Version an zwei Stellen (package.json UND
  # Container-Tag) und musste von Hand synchron gehalten werden — jedes
  # Dependabot-Playwright-Update ist dadurch zwangslaeufig gescheitert.
  # Jetzt gibt es nur noch eine Quelle der Wahrheit: das Lockfile.
  playwright-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.lesen.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: lesen
        run: |
          VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "Playwright laut Lockfile: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  test-e2e:
    needs: playwright-version
    runs-on: ubuntu-latest
    # Offizielles Playwright-Image mit VORINSTALLIERTEM Chromium (Browser-Version
    # exakt passend zur installierten @playwright/test). Damit entfaellt der
    # fehleranfaellige Browser-Download von cdn.playwright.dev komplett — der
    # blieb in der CI zuverlaessig nach dem 100%-Download beim Entpacken/
    # Finalisieren haengen und blockierte als Pflicht-Check JEDEN PR.
    # Der Tag wird aus dem Lockfile abgeleitet, siehe Job playwright-version.
    # Von Hand zu pflegen bleibt nur noch der Basis-Name (-jammy).
    #
    # OSS-2026-08-12-24: Das Etikett ist BEWEGLICH — derselbe Name kann morgen
    # einen anderen Inhalt tragen. Bewusst kein Digest-Pin: Der Tag wird aus dem
    # Lockfile abgeleitet, ein fester Digest wuerde bei jedem Playwright-Update
    # einen Pflicht-Check brechen, bis jemand von Hand nachzieht. Vertretbar,
    # weil dieser Job weder Geheimnis noch Token noch Schreibrechte hat und
    # nichts ausliefert — das schlimmste Ergebnis eines untergeschobenen Images
    # ist ein falsches Testergebnis. Begruendung und Bedingung fuer eine
    # Neubewertung: docs/SECURITY-MODEL.md, Restrisiko 7.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-jammy
    # Firefox startet im Container nur mit HOME=/root — Playwright sagt es im
    # Fehlertext selbst: "Firefox is unable to launch if the $HOME folder isn't
    # owned by the current user." Ohne diese Zeile scheitern ALLE Firefox-Laeufe
    # mit "Failed to launch the browser process", was wie ein Barrierefreiheits-
    # Befund aussieht und keiner ist. Chromium und WebKit brauchen es nicht.
    env:
      HOME: /root
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run test:e2e

      # Ohne diesen Schritt hinterlaesst ein roter Browser-Test NICHTS — kein
      # Bild, kein Ablaufprotokoll. Ein Fehler, der sich lokal nicht
      # nachstellen laesst, bleibt damit grundsaetzlich unaufklaerbar.
      - name: Fehlerbilder und Aufzeichnungen sichern
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-fehler
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  lighthouse:
    # Misst die LIVE-Domain, nicht den geprüften Stand. K12 (Audit 2026-08-13):
    # In diesem Projekt sind Push und Deploy ENTKOPPELT — ein Push landet auf
    # main, deployt wird erst danach von Hand. Dieser Lauf misst also den Stand,
    # der (noch) live ist, nicht den gerade gepushten Commit. Das Ergebnis ist
    # ein reiner Live-Monitor der Performance/Qualität und BEWUSST nicht
    # blockierend (nicht in der Branch Protection) — es dem gepushten Commit
    # zuzuschreiben wäre irreführend. Auf PRs liefe es gegen den falschen Stand,
    # deshalb nur auf push.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: |
            https://malzi.me
            https://malzi.me/datenschutz
            https://malzi.me/impressum
          budgetPath: .github/lighthouse-budget.json
          uploadArtifacts: true

  # ── Die vier Pruefungen: alle blockierend ──────────────────────────────
  # Warum als Pflicht-Check und nicht als Erinnerung: Die Regel "nicht
  # behaupten, GPS verlasse das Geraet nie" stand seit Monaten in CONTRIBUTING
  # und wurde trotzdem an fuenf Stellen verletzt (README 2x, CONTRIBUTING,
  # CHANGELOG, public/llms.txt) — gefunden erst durch diesen Job am 2026-08-12.
  # Eine Wording-Regel ohne Test ist eine Bitte, kein Schutz.
  #
  # Am 2026-08-12 liefen drei der vier zunaechst NICHT blockierend, weil sie
  # 15 Fundstellen meldeten. Beim Nachpruefen war eine davon echt und der Rest
  # Fehlalarm der Pruefungen selbst. Die Pruefungen wurden geschaerft (jeweils
  # mit eigener Probe in selbstpruefung.sh), der eine echte Fund behoben.
  # Seitdem sind alle vier gruen — und deshalb verbindlich.
  #
  # Konfiguration im Projekt: .pruefungen/aussentext.txt (Sperrliste) und
  # .pruefungen/fakten.txt (welche Zahlen genau einen Wert haben duerfen).
  pruefungen:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 holt die volle Historie. Sie wird von
      # pruefe-mitzieher.py gebraucht: Der Waechter vergleicht gegen den
      # Zielzweig, um zu sehen, WAS geaendert wurde. Mit dem Standard (nur der
      # letzte Commit) faende er gar nichts und waere stillschweigend gruen —
      # also genau das, wovor er schuetzen soll.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Node ausdruecklich einrichten statt auf die Vorinstallation des Runners
      # zu vertrauen: Der Pruefsummen-Waechter unten laeuft mit node, und eine
      # stillschweigende Annahme ueber die Umgebung ist genau die Sorte
      # Voraussetzung, die irgendwann unbemerkt wegfaellt.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # BEFUND 01.09.2026 (Runde 7, L-15): Fuer Node steht die Begruendung
      # oben — fuer Python galt sie genauso, nur stand sie nirgends. Sechs
      # Waechter laufen mit python3; bisher mit dem, was das Runner-Image
      # gerade mitbrachte. Faellt das weg oder springt es auf eine Fassung,
      # die eine Datei anders liest, meldet die Pipeline keinen fehlenden
      # Waechter, sondern einen Fehler an falscher Stelle.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Zuerst die Pruefungen selbst pruefen: je Pruefung eine Probe gegen
      # kaputtes und eine gegen sauberes Material. Ohne diesen Schritt koennte
      # ein defekter Pruefer gruen melden, ohne etwas geprueft zu haben.
      # Die Anzahl der Proben steht NUR im Skript selbst — sie hier zu
      # wiederholen hiesse, sie irgendwann falsch zu wiederholen.
      - run: sh scripts/pruefungen/selbstpruefung.sh

      - run: python3 scripts/pruefungen/checks/aussentext.py .
      - run: python3 scripts/pruefungen/checks/fakten-drift.py .
      - run: python3 scripts/pruefungen/checks/stiller-fehlschlag.py .
      # BEFUND 01.09.2026 (Runde 7, K-8): Der Aufruf darueber ueberspringt
      # Punkt-Verzeichnisse — und alle fuenf yml-Dateien liegen unter .github/.
      # Der Waechter fuer verschluckte Fehler sah die Auslieferungskette nie.
      # Das Werkzeug ist vendoriert; statt es zu bearbeiten, wird es hier
      # zusaetzlich dorthin gerichtet.
      - run: python3 scripts/pruefungen/checks/stiller-fehlschlag.py .github
      - run: python3 scripts/pruefungen/checks/test-blind.py .

      # UX-2026-08-21-06: Jedes uebersetzbare Element traegt einen Text fest im
      # HTML. Der ist kein Platzhalter — Besucher sehen ihn, solange die
      # Sprachdatei nicht geladen ist, und dauerhaft, wenn sie gar nicht laedt.
      # Am 21.08. war der Limit-Hinweis der Startseite dort in einer alten
      # Fassung stehen geblieben, waehrend die Sprachdatei laengst die
      # ueberarbeitete trug: vier Absaetze, unbemerkt, weil dieser Hinweis nur
      # bei Andrang erscheint — also ausgerechnet im Workshop.
      - run: python3 scripts/pruefe-i18n-fallbacks.py

      # OPS-2026-08-21-08: Eine Wartezeit ueber dem Zeitlimit des Tests ist
      # wirkungslos — der Test stirbt vorher. In vier Tests standen solche
      # Werte, teils mit Kommentaren, die eine frueher behobene Flakiness
      # beschrieben. Behoben war nichts; am 21.08. hat einer davon die
      # Auslieferung blockiert. Die Pruefung blendet Kommentare aus, sonst
      # tarnt ein auskommentiertes test.slow() den Befund.
      - run: python3 scripts/pruefe-tote-geduld.py
      - run: python3 scripts/pruefe-doppelte-werte.py

      # 31.08.2026: Zwei Waechter gegen die Fehlerklasse, die den Umbau vom
      # 30.08. so teuer gemacht hat.
      #
      # Der erste prueft, ob eine Aenderung ihre Begleiter mitgebracht hat: Ein
      # neues Pflichtfeld im Einstellungssatz muss an vier weiteren Stellen
      # nachgezogen werden. Am 30.08. wurden zwei davon vergessen und erst vom
      # Testlauf gefunden.
      #
      # Der zweite meldet, wenn Dateien wieder zusammenwachsen. mistral.js war
      # auf 1681 Zeilen; an betriebsprofil.js haengen 15 Module. Aufteilen
      # allein haelt nicht, wenn niemand hinsieht.
      #
      # BEIDE brauchen die Vergleichsbasis, deshalb steht fetch-depth: 0 im
      # Checkout dieses Jobs.
      - run: python3 scripts/pruefe-mitzieher.py
      - run: python3 scripts/pruefe-kopplung.py

      # 31.08.2026: Die Rueckbauprobe hat gezeigt, dass scripts/deploy.sh von
      # KEINEM Test abgedeckt war — Trockenlauf, Aufraeumfalle, Stand-Bindung
      # und Notschalter-Bilanz liessen sich entfernen, ohne dass etwas rot
      # wurde. Ausgerechnet dort stehen die Riegel, die ungeprueften Code von
      # der Produktion fernhalten.
      - run: python3 scripts/pruefe-deploy-riegel.py

      # Und die drei Waechter pruefen sich selbst — in BEIDE Richtungen.
      # Anlass 31.08.2026: Ein Pruefer ohne Vorwissen fand, dass zwei von
      # ihnen gruen meldeten, ohne etwas gemessen zu haben. Die Fehler waren
      # behoben, aber nichts hielt sie fest.
      - run: bash scripts/selbstpruefung-waechter.sh

      # OSS-2026-08-12-22: Die selbst gehosteten Fremdbibliotheken (exifr,
      # Leaflet, die Schriften) hatten keinen Unveraendertheits-Nachweis. Eine
      # Aenderung an 147 KB minifiziertem Einzeiler faellt in einem Pull-Request
      # niemandem auf — ausgerechnet exifr liest die GPS-Daten, deren
      # Nichtweitergabe die Kernzusage dieses Projekts ist.
      #
      # Wird eine Bibliothek bewusst ausgetauscht, stempelt
      # `node scripts/pruefe-fremddateien.mjs --aktualisieren` die Liste neu.
      # Der eigene Schalter ist Absicht: Der Austausch soll eine sichtbare
      # Zeile im Diff sein, keine Nebenwirkung.
      - run: node scripts/pruefe-fremddateien.mjs
      # BEFUND 01.09.2026 (Runde 7, L-5): ignorierte Dateien unter public/,
      # die firebase.json nicht ausschliesst, wuerden ausgeliefert, ohne in
      # git oder im Sauberkeits-Riegel des Deploys aufzutauchen.
      - run: node scripts/pruefe-auslieferbare-reste.mjs
      # Mutationsprobe: Merken die Tests es, wenn der geaenderte Code
      # kaputtgeht? Sechs von achtzehn Befunden der Pruefrunde 7 waren
      # Stellen, an denen sich Code aendern liess, ohne dass ein Test rot
      # wurde. Sie laeuft NUR hier, nicht vor dem Push: je Mutation ein
      # eigener Testlauf, das dauert Minuten. Zeitfenster je Datei, und
      # was darin nicht geprueft wurde, meldet sie als ungemessen.
      - run: node scripts/pruefe-mutationen.mjs --zeitgrenze=4

      # TEST-2026-08-12-28: `scripts/pruefungen/` ist eine Kopie aus der
      # Audit-Familie. Kopien driften — diese war es bereits: Beim Kopieren
      # gingen die Punktverzeichnisse unter, in einer Beispielprobe fehlte
      # dadurch die Regeldatei, und die Pruefung legte sich beim Lauf still eine
      # Vorlage an. Gruen, aber aus einem anderen Grund als gedacht.
      #
      # In der Pipeline schlaegt der Waechter an, wenn jemand die KOPIE
      # bearbeitet hat statt der Quelle — der haeufigere Fehler, weil nur die
      # Kopie im Repository liegt. Ob die Quelle weitergezogen ist, kann hier
      # niemand sehen; der Lauf sagt das ausdruecklich dazu, statt es zu
      # verschweigen.
      - run: node scripts/pruefe-vendorierung.mjs


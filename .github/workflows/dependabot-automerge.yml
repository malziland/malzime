name: Dependabot Auto-Merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot-Metadaten holen
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Auto-Merge NUR fuer patch + minor. Major-Updates (und alles andere)
      # brauchen bewusste manuelle Freigabe — verhindert, dass ein groesserer
      # oder kompromittierter Versionssprung ungeprueft auf main landet
      # (Supply-Chain-Haertung, Audit OPS-002).
      #
      # ZUSAETZLICH ausgeschlossen: Produktiv-Abhaengigkeiten des Backends
      # (`/functions`, `direct:production`). Grund aus der Praxis (2026-07-29):
      # Der Sammel-PR #58 war als `minor` eingestuft (firebase-functions
      # 7.2.5 -> 7.3.2), transportierte darin aber einen MAJOR-Sprung seines
      # Innenlebens — Express 4 -> 5 samt body-parser 2 und path-to-regexp 8.
      # Die reine update-type-Pruefung sieht nur das Etikett des aeusseren
      # Pakets, nicht was im Lockfile darunter passiert. Fuer Code, der im
      # Produktivbetrieb Uploads verarbeitet, ist das zu wenig.
      # Backend-WERKZEUGE (eslint, prettier, jest) laufen weiterhin durch.
      - name: Auto-Merge (patch + minor, ohne Backend-Produktivpakete)
        if: >
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor') &&
          !(steps.meta.outputs.directory == '/functions' &&
            steps.meta.outputs.dependency-type == 'direct:production')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Sicherheit nachts

# Jede Nacht drei Pruefungen, die nicht auf einen Pull Request warten duerfen.
#
# WARUM (30.09.2026): Eine neue Sicherheitsluecke in einem Paket fiel bisher
# erst beim naechsten Pull Request auf, weil der Audit-Riegel nur dort lief —
# ohne Arbeit am Projekt kein Alarm. Die mitgelieferten Bibliotheken unter
# public/lib sah gar keine Pruefung, und die Abkuendigungshinweise von GitHub
# standen ungelesen an gruenen Laeufen. Befunde OSS-2026-09-30-01/-02/-06,
# OPS-2026-09-30-03.
#
# ALARM: Ein roter Lauf dieses Workflows loest die Benachrichtigung von GitHub
# aus (bei geplanten Laeufen an die Person, die den Zeitplan zuletzt geaendert
# hat). Drei getrennte Jobs, damit sofort sichtbar ist, WELCHE Pruefung rot ist.
# Was bei Rot zu tun ist: docs/RUNBOOK.md, Abschnitt "Nachtlauf Sicherheit rot".

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: "43 3 * * *" # taeglich 03:43 UTC, vor dem Arbeitstag in Wien
  workflow_dispatch:
  # Aenderungen an den Pruefungen selbst werden auf ihrem Zweig sofort
  # ausprobiert, nicht erst in der naechsten Nacht. Nicht auf main: Dort liefe
  # der Lauf direkt beim Zusammenfuehren, noch bevor die Pipeline des neuen
  # Standes fertig ist — der Job abkuendigungen laese dann die Hinweise des
  # VORIGEN Standes und schluege falschen Alarm (Befund G-14, 30.09.2026).
  push:
    branches-ignore: [main]
    paths:
      - scripts/audit-gate.mjs
      - scripts/pruefe-fremd-meldungen.mjs
      - scripts/pruefe-abkuendigungen.mjs
      - .github/audit-allowlist.json
      - .github/fremd-meldungen-ausnahmen.json
      - .github/abkuendigungen-ausnahmen.json
      - .github/workflows/sicherheit-nachts.yml

jobs:
  npm-luecken:
    # Derselbe Riegel wie im Pull Request, beide Baeume, alle Abhaengigkeiten.
    # npm audit braucht nur die Lockfiles, keine Installation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: node scripts/audit-gate.mjs functions .

  mitgelieferte-bibliotheken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: node scripts/pruefe-fremd-meldungen.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  abkuendigungen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: node scripts/pruefe-abkuendigungen.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Auto-Release aus CHANGELOG

# Legt automatisch einen GitHub-Release an, sobald im CHANGELOG oben eine neue
# stabile Version (x.y.z) steht und das auf main landet. Manuell ausloesbar ueber
# "Run workflow". Idempotent: existiert der Tag schon, passiert nichts.

on:
  push:
    branches: [main]
    paths: ["CHANGELOG.md"]
  workflow_dispatch: {}

# KA-03: Nie zwei Release-Laeufe gleichzeitig — zwei schnelle CHANGELOG-Pushes
# koennten sich sonst beim Loeschen/Anlegen von Tag und Release ueberholen.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags werden gebraucht, damit die Kollisionspruefung unten
          # `git rev-parse refs/tags/...` aufloesen kann. Ohne das ist der
          # Checkout flach und ohne Tags — die Pruefung liefe ins Leere.
          fetch-depth: 0

      - name: Neueste CHANGELOG-Version pruefen und Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # OPS-2026-08-12-30: Die OBERSTE Ueberschrift entscheidet, nicht die
          # erste Zeile, die wie eine Version aussieht. Steht [Unveroeffentlicht]
          # obenauf, ist nichts zu releasen — die naechste Nummer weiter unten
          # ist bereits ausgeliefert und darf nicht umgehaengt werden. Die
          # Auswertung liegt in scripts/changelog-oberste-version.sh, damit sie
          # von Tests erreichbar ist; im YAML war sie es nie.
          RC=0
          VERSION="$(sh scripts/changelog-oberste-version.sh CHANGELOG.md)" || RC=$?
          if [ "$RC" -eq 2 ]; then
            echo "CHANGELOG nicht auswertbar — Abbruch statt stillem Durchwinken."
            exit 1
          fi
          if [ "$RC" -ne 0 ]; then
            echo "Oberster CHANGELOG-Abschnitt: '$VERSION' — keine stabile Version, nichts zu tun."
            exit 0
          fi
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release existiert schon. Zwei erlaubte Faelle:
            # (a) Text-Korrektur an einem veroeffentlichten Abschnitt — die
            #     oberste Nummer aendert sich nicht, nichts zu tun
            #     (Entscheidung 2026-08-11, Kurzaudit OPS-103; Fehlalarm #78).
            # (b) Die oberste Nummer wurde auf eine schon vergebene Nummer
            #     GEAENDERT. Entscheidung des Inhabers vom 2026-08-11: Nummern
            #     DUERFEN wiederverwendet werden — der fruehere Kollisions-
            #     Fehler entfaellt. Damit Tag und CHANGELOG nicht auseinander-
            #     laufen (die OPS-002-Falle vom 2026-08-10), wird der Tag samt
            #     Release hier auf DIESEN Stand umgehaengt statt zu scheitern.
            # OPS-2026-08-13-35: Exit 1 ist hier normal (oberster Abschnitt ist
            # keine Version, etwa [Unveroeffentlicht]) — Exit 2 oder eine leere
            # Antwort heisst dagegen "Messung gescheitert". Vorher schluckte
            # `|| true` beides, VORHER blieb leer, und der Umhaeng-Pfad lief
            # weiter: dieselbe Tuer wie OPS-30, nur einen Schritt spaeter.
            RC_VORHER=0
            VORHER="$(git show "$GITHUB_SHA^:CHANGELOG.md" | sh scripts/changelog-oberste-version.sh)" || RC_VORHER=$?
            if [ "$RC_VORHER" -eq 2 ] || [ -z "$VORHER" ]; then
              echo "FEHLER: Elternstand des CHANGELOG nicht auswertbar — Abbruch statt Umhaengen auf Verdacht."
              exit 1
            fi
            if [ "$VORHER" = "$VERSION" ]; then
              echo "Release $TAG existiert; der Push aendert die oberste Version nicht (Doku-Korrektur) — nichts zu tun."
              exit 0
            fi
            TAG_SHA="$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" || echo "")"
            if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" = "$GITHUB_SHA" ]; then
              echo "Release $TAG existiert bereits und zeigt auf diesen Stand — nichts zu tun."
              exit 0
            fi
            # KA-03 (Kurzaudit 2026-08-12), zwei Haertungen:
            #  1. Der alte Tag-Zeiger wird VOR jeder Loeschung protokolliert —
            #     die einzige dauerhafte Spur, wohin die Nummer vorher zeigte
            #     (Unfall- und Missbrauchs-Nachweis im Workflow-Log).
            #  2. Reihenfolge gedreht: ERST der Tag, DANN der Release. Bricht
            #     der Lauf dazwischen ab, bleibt "Tag weg, Release verwaist" —
            #     dieser Zweig hier raeumt das beim naechsten Lauf von selbst
            #     auf (TAG_SHA ist dann leer). Die alte Reihenfolge liess
            #     stattdessen "Release weg, Tag zeigt auf alt" zurueck — und
            #     ein Folgelauf haette den neuen Release still auf den ALTEN
            #     Tag-Zeiger gelegt (gh ignoriert --target bei vorhandenem
            #     Tag): exakt die OPS-002-Falle.
            echo "Nummer $VERSION wird wiederverwendet — alter Tag-Zeiger: ${TAG_SHA:-<Tag fehlt bereits, nur verwaister Release>}"
            if [ -n "$TAG_SHA" ]; then
              git push origin ":refs/tags/$TAG"
            fi
            gh release delete "$TAG" --yes
          fi
          # KA-03, Wache vor dem Anlegen: Existiert der Tag auf origin noch
          # (halber Durchlauf einer aelteren Workflow-Version, manuell
          # angelegter Tag), wuerde `gh release create` das --target ignorieren
          # und den Release-Text auf einen fremden Stand heften. Dann lieber
          # laut scheitern — der Lauf ist gefahrlos wiederholbar.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "FEHLER: Tag $TAG existiert noch auf origin, aber kein Release dazu passt zu diesem Stand — Abbruch statt Release auf falschen Zeiger. Tag pruefen/loeschen und Workflow erneut starten."
            exit 1
          fi
          # Release-Notizen = der Abschnitt genau dieser Version
          awk -v v="## [$VERSION]" '
            index($0, v)==1 {f=1; next}
            /^## \[/ {if (f) exit}
            f {print}
          ' CHANGELOG.md > notes.md
          echo "Lege Release $TAG an ..."
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
          echo "Fertig: $TAG"

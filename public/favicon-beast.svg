<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="malziME">
  <title>malziME</title>
  <style>
    /* Beast-Modus der SEITE, nicht Systemthema — deshalb feste Farben und
       keine Medienabfrage.

       DUNKLER Kasten, helles ME. Die erste Fassung hatte es umgekehrt (heller
       Kasten, dunkles ME) — das ist die Fassung der Vorlage fuer eine DUNKLE
       Tab-Leiste. Auf einer hellen Leiste, wie sie ein Mac im hellen
       Systemthema hat, war sie praktisch unsichtbar: "Der Tab bleibt immer
       noch hell" (Nutzer, 2026-08-19). Er hatte recht — ich hatte ein helles
       Zeichen ausgeliefert und behauptet, es sei ein Moduswechsel.

       Diese Fassung traegt die Beast-Farben der Seite (#171d1f Grund,
       #eef1f0 Schrift) und hebt sich damit auf JEDER Leiste vom Petrol ab. */
    .kasten { fill: #171d1f }
    .zeichen { fill: #eef1f0 }
  </style>
  <rect class="kasten" width="1000" height="1000" rx="181.8" ry="181.8"/>

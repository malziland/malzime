name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # v3.0.0 laeuft nativ auf Node.js 24 — der frueher noetige
          # FORCE_JAVASCRIPT_ACTIONS_TO_NODE24-Workaround entfaellt damit.

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run lint:frontend
      - run: npm run format:frontend:check
      - run: npm run test:frontend

  test-e2e:
    runs-on: ubuntu-latest
    # Hartes Job-Limit, damit ein haengender Schritt nie wieder bis zum
    # 6h-GitHub-Maximum laeuft (`--with-deps` blieb genau dort haengen).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      # Chromium-Browser fuer Playwright installieren. Dieser Schritt hing in der
      # CI schon zweimal: erst `--with-deps` an apt (bis 6h), danach blieb auch
      # der reine Browser-Download von cdn.playwright.dev minutenlang stehen
      # (CDN-Stall) und lief erst ins Job-Timeout — DAS war der Grund, warum
      # Dependabot-PRs nie durchkamen (e2e ist Pflicht-Check). Loesung: jeder
      # Download-Versuch bekommt ein hartes 4-Minuten-Limit; bei Haenger bis zu
      # 3 Versuche. Ein gesunder Download ist in ~30s durch.
      - name: Chromium installieren (Timeout + Retry gegen CDN-Download-Haenger)
        run: |
          for i in 1 2 3; do
            timeout 240 npx playwright install chromium && exit 0
            echo "Versuch $i: Chromium-Download haengt/abgebrochen — neuer Versuch in 5s ..."
            sleep 5
          done
          echo "::error::Chromium-Download nach 3 Versuchen fehlgeschlagen (cdn.playwright.dev)"
          exit 1
      - run: npm run test:e2e

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: |
            https://malzi.me
            https://malzi.me/datenschutz
            https://malzi.me/impressum
          budgetPath: .github/lighthouse-budget.json
          uploadArtifacts: true

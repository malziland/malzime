name: Dependabot Auto-Merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot-Metadaten holen
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # AUDIT-BEFUND OSS-2026-08-12-20: Aendert der PR eine Workflow-Datei, laeuft
      # fremder Code in genau den Pflicht-Checks, die den Merge freigeben — der
      # einzige Weg, auf dem ungeprueft Fremdcode nach main gelangt. Solche PRs
      # gehen ueber die Hand.
      # Bewusst an den GEAENDERTEN DATEIEN gemessen, nicht am Oekosystem-Feld:
      # Der Commit-Trailer eines Actions-PRs enthaelt gar kein
      # `package-ecosystem` (an PR #57 nachgesehen), ein Filter darauf waere
      # leer verglichen und haette still nie gegriffen.
      - name: Beruehrt der PR die Auslieferkette?
        id: flaechen
        run: |
          set -euo pipefail
          DATEIEN=$(gh pr diff --name-only "$PR_URL")
          if [ -z "$DATEIEN" ]; then
            echo "Keine Dateiliste erhalten — im Zweifel keine Automatik." >&2
            echo "kette=ja" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$DATEIEN" | grep -q '^\.github/'; then
            echo "kette=ja" >> "$GITHUB_OUTPUT"
          else
            echo "kette=nein" >> "$GITHUB_OUTPUT"
          fi
          printf 'Geaenderte Dateien:\n%s\n' "$DATEIEN"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Auto-Merge NUR fuer patch + minor. Major-Updates (und alles andere)
      # brauchen bewusste manuelle Freigabe — verhindert, dass ein groesserer
      # oder kompromittierter Versionssprung ungeprueft auf main landet
      # (Supply-Chain-Haertung, Audit OPS-002).
      #
      # ZUSAETZLICH ausgeschlossen: Produktiv-Abhaengigkeiten des Backends
      # (`/functions`, `direct:production`). Grund aus der Praxis (2026-07-29):
      # Der Sammel-PR #58 war als `minor` eingestuft (firebase-functions
      # 7.2.5 -> 7.3.2), transportierte darin aber einen MAJOR-Sprung seines
      # Innenlebens — Express 4 -> 5 samt body-parser 2 und path-to-regexp 8.
      # Die reine update-type-Pruefung sieht nur das Etikett des aeusseren
      # Pakets, nicht was im Lockfile darunter passiert. Fuer Code, der im
      # Produktivbetrieb Uploads verarbeitet, ist das zu wenig.
      # Backend-WERKZEUGE (eslint, prettier, jest) laufen weiterhin durch.
      - name: Auto-Merge (patch + minor, ohne Backend-Produktivpakete)
        # OPS-006 (Audit 2026-08-10): Die Ausnahme prueft NICHT mehr auf
        # Gleichheit. Vorher musste `dependency-type` exakt 'direct:production'
        # sein — bei einem GRUPPIERTEN PR (die Gruppe `backend-sicherheit` in
        # dependabot.yml hat keinen dependency-type-Filter und mischt deshalb
        # Produktiv- und Werkzeugpakete) liefert die Metadaten-Action nicht
        # diesen Einzelwert, und die Ausnahme lief ins Leere. Ebenso ungedeckt
        # war 'indirect', also ein Sicherheitsupdate, das ein transitives
        # Produktivpaket in functions/ anhebt.
        # Jetzt gilt: Sobald functions/ ueberhaupt betroffen ist, keine
        # automatische Zusammenfuehrung — Handpruefung. Backend-WERKZEUGE
        # (eslint, prettier, jest) laufen dadurch ebenfalls ueber die Hand;
        # das ist der bewusst in Kauf genommene Preis, weil die Unterscheidung
        # im gruppierten Fall nicht verlaesslich ist.
        if: >
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor') &&
          !contains(steps.meta.outputs.directory, '/functions') &&
          steps.flaechen.outputs.kette == 'nein'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
